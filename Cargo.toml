[package]
name = "liquid-glass"
version = "0.1.0"
edition = "2021"
description = "A reusable GPU-composited liquid glass backdrop for Tauri (and any Win32) overlay windows"
license = "MIT"

[lib]
name = "liquid_glass"

[workspace]
members = ["glass-broker", "glass-demo"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.58", features = [
  "Graphics_Capture",
  "Security_Authorization_AppCapabilityAccess",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_Gdi",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
